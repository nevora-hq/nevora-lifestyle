name: item35-weekly

# item35(scripts/verify-rendered-layout.js)を全記事に対して週1で --strict 実行する。
# publish-queue とは独立したジョブで、記事の公開フローは一切止めない。
# 検出が出た場合は Issue を立てて気づけるようにする(公開の可否には影響しない)。
#
# 想定所要時間: Chromiumのインストール込みで10〜15分程度。
# 分割実行しているのは、195記事を1プロセスで回すとタイムアウトしやすいため
# (2026-08-25、ローカルで10分でタイムアウトした実績にもとづく)。

on:
  schedule:
    # cronはUTC。JST 日曜 3:07 = UTC 土曜 18:07
    - cron: "7 18 * * 6"
  workflow_dispatch:

concurrency:
  group: item35-weekly
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # next.config.js が本番ビルドで未設定をエラーにするため必須。
      # 未設定だと components/Layout.js が canonical/OGP を出力しなくなる。
      # 公開URLであり秘密情報ではないので直書きしてよい。
      # ローカルでは .env.local から読まれるが、同ファイルはgit管理外のためCIには無い。
      NEXT_PUBLIC_SITE_URL: https://nevora-lifestyle.vercel.app
    steps:
      # 各アクションは node24 ランタイムで動くメジャーへ更新済み(2026-09-07)。
      # node20 ランタイムのメジャー(checkout@v4、setup-node@v4、
      # upload-artifact@v4・v5、github-script@v7)は実行時に deprecation 警告が出る。
      # upload-artifact は v5 もまだ node20 なので、v4→v5 では警告が消えない点に注意。
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: サイト運営/サイト本体/package-lock.json

      - name: 依存関係のインストール
        working-directory: サイト運営/サイト本体
        run: npm ci

      - name: Chromiumのインストール
        working-directory: サイト運営/サイト本体
        # --no-install は「レジストリから取ってこず、node_modules のCLIだけを使う」意味。
        # これを付けないと npx がレジストリの最新版playwrightを都度取得し、
        # devDependenciesのplaywright-coreが期待するブラウザリビジョンとズレて
        # 「Executable doesn't exist at .../chromium_headless_shell-XXXX/...」で落ちる。
        # そのため playwright / playwright-core は同一バージョンで完全固定している。
        run: |
          npx --no-install playwright --version
          npx --no-install playwright install --with-deps chromium

      - name: ビルド(prebuildでsync-contentが走る)
        working-directory: サイト運営/サイト本体
        env:
          TZ: Asia/Tokyo
        run: npm run build

      - name: item35を全記事へ--strictで実行
        id: verify
        working-directory: サイト運営/サイト本体
        env:
          TZ: Asia/Tokyo
        run: |
          set -o pipefail
          # 確定稿の全スラッグをLFで書き出す
          # (CRLFのままだとURLに%0Dが付いて全記事404になる。2026-08-24に実際に踏んだ)
          # このリポジトリは公開後も記事を確定稿に置いたままにする運用のため、走査先はここだけ。
          # 確定稿が無い・0件は「記事が消えた/フォルダ名が変わった」異常なので、
          # 静かに成功させず失敗させる(週次CIが検査ゼロのままグリーンで通り続けるのを防ぐ)。
          src=../記事データ/確定稿
          if [ ! -d "$src" ]; then
            echo "::error::${src} が存在しません" >&2
            exit 1
          fi
          find "$src" -maxdepth 1 -type f -name '*.md' -printf '%f\n' \
            | sed 's/\.md$//' | tr -d '\r' | sort -u > /tmp/slugs.txt
          total=$(wc -l < /tmp/slugs.txt)
          echo "対象 ${total} 記事"
          if [ "$total" -eq 0 ]; then
            echo "::error::${src} に対象記事がありません" >&2
            exit 1
          fi
          split -l 33 /tmp/slugs.txt /tmp/batch_
          fail=0
          : > /tmp/item35.log
          for b in /tmp/batch_*; do
            echo "--- $(basename "$b") ---" | tee -a /tmp/item35.log
            if ! node scripts/verify-rendered-layout.js --strict $(tr '\n' ' ' < "$b") 2>&1 | tee -a /tmp/item35.log; then
              fail=1
            fi
          done
          # 種別ごとの件数を出しておく(Issue本文に載せる)
          {
            echo "対象記事数: ${total}"
            for k in TEXT_SHAPE_OVERLAP IMAGE_CROP_RISK OVERFLOW COLLISION OFFSCREEN; do
              echo "${k}: $(grep -c "ITEM35_${k}" /tmp/item35.log || true) 件"
            done
          } > /tmp/summary.txt
          cat /tmp/summary.txt
          {
            echo 'summary<<EOF'
            cat /tmp/summary.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"
          exit $fail

      - name: 検出ログを成果物として保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: item35-log
          path: /tmp/item35.log
          retention-days: 30

      - name: 失敗時にIssueを立てる
        if: failure()
        uses: actions/github-script@v9
        env:
          SUMMARY: ${{ steps.verify.outputs.summary }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = "item35(実測レンダリング検査)が失敗しました";
            // 同じ件名の未クローズIssueがあれば追記に留める(週1実行でIssueが増殖しないように)
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "item35",
            });
            const body = [
              "図解・画像のレイアウト検査で検出がありました。対処手順は docs/CONTRIBUTING.md の32節を参照してください。",
              "",
              "```",
              (process.env.SUMMARY || "(集計を取得できませんでした)").trim(),
              "```",
              "",
              `実行ログ(全文はArtifacts「item35-log」): ${runUrl}`,
            ].join("\n");
            if (issues.length > 0) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issues[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ["item35"] });
            }
